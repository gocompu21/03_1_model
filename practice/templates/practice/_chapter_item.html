{% load practice_extras %}
<div id="chapter-{{ chapter.id }}" class="chapter-item level-{{ chapter.level }}">
    <a href="{% url 'practice:chapter_detail' chapter.id %}" class="chapter-link">
        <span class="chapter-code">{{ chapter.code }}</span>&nbsp;&nbsp;<span class="chapter-title">{{ chapter.title }}</span>
    </a>
    {% if chapter.questions.count > 0 %}
    <a href="{% url 'practice:practice_questions' chapter.id %}" class="chapter-count" style="text-decoration: none;">{{ chapter.questions.count }}문제</a>
    {% endif %}
</div>
{% for child in chapter.children.all %}
    {% include 'practice/_chapter_item.html' with chapter=child %}
{% endfor %}
