<!DOCTYPE html>
<html>
<head>
    <style>
        .term-highlight { color: #d93025; font-weight: bold; }
    </style>
    <script>
    MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
    };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
    <h1>Final Fix Verification</h1>
    
    <h3>Case 1: Plain Text</h3>
    <div id="case1">81. 양이온교환용량(CEC)을 증가시키는 요인이 아닌 것은?</div>

    <h3>Case 2: Simple LaTeX Text</h3>
    <div id="case2">양이온교환용량($\text{CEC}$)이 증가합니다.</div>

    <h3>Case 3: Nested LaTeX Fraction</h3>
    <div id="case3">$$ \frac{ \text{양이온교환용량(CEC)} }{ 2 } $$</div>

    <h3>Case 4: Math Mode (Should NOT highlight)</h3>
    <div id="case4">$$ CEC = 5 $$</div>

    <script>
        const currentTerm = "CEC";

        function isContextTextMode(text, index) {
            let balance = 0;
            let dollarCount = 0;
            for (let i = index - 1; i >= 0; i--) {
                const char = text[i];
                if (char === '}') {
                    balance++;
                } else if (char === '{') {
                    balance--;
                    if (balance < 0) {
                        const prefix = text.slice(0, i);
                         if (/\\(text|textbf|textit|textrm|textsf)[a-zA-Z]*$/.test(prefix)) {
                            if (dollarCount % 2 !== 0) return false; 
                            return true;
                        }
                    }
                } else if (char === '$') {
                     if (!(i > 0 && text[i-1] === '\\')) dollarCount++;
                }
            }
            return false;
        }

        function highlightTerm(htmlContent) {
            if (!currentTerm || !htmlContent) return htmlContent;
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            
            function walk(node) {
                if (node.nodeType === 3) { 
                    const text = node.nodeValue;
                    if (!text.trim()) return;

                    if (text.toLowerCase().indexOf(currentTerm.toLowerCase()) === -1) return;

                    const fragment = document.createDocumentFragment();
                    const escapedTerm = currentTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const termRegex = new RegExp(`(${escapedTerm})`, 'gi');
                    
                    const parts = text.split(/(\$[^$]+\$)/g);
                    
                    parts.forEach(part => {
                        if (part.startsWith('$') && part.endsWith('$')) {
                            let cursor = 0;
                            let resultPart = "";
                            const matches = [...part.matchAll(termRegex)];
                            
                            if (matches.length === 0) {
                                resultPart = part;
                            } else {
                                matches.forEach(match => {
                                    const matchStr = match[0];
                                    const idx = match.index;
                                    if (idx > cursor) resultPart += part.slice(cursor, idx);
                                    
                                    if (isContextTextMode(part, idx)) {
                                        resultPart += `} {\\color{#d93025}\\text{${matchStr}}} \\text{`;
                                    } else {
                                        resultPart += `{\\color{#d93025}${matchStr}}`;
                                    }
                                    cursor = idx + matchStr.length;
                                });
                                if (cursor < part.length) resultPart += part.slice(cursor);
                            }
                            fragment.appendChild(document.createTextNode(resultPart));
                        } else {
                            let cursor = 0;
                            const matches = [...part.matchAll(termRegex)];
                            if (matches.length === 0) {
                                 fragment.appendChild(document.createTextNode(part));
                            } else {
                                matches.forEach(match => {
                                    const matchStr = match[0];
                                    const idx = match.index;
                                    if (idx > cursor) fragment.appendChild(document.createTextNode(part.slice(cursor, idx)));
                                    const span = document.createElement('span');
                                    span.className = 'term-highlight';
                                    span.textContent = matchStr;
                                    fragment.appendChild(span);
                                    cursor = idx + matchStr.length;
                                });
                                if (cursor < part.length) fragment.appendChild(document.createTextNode(part.slice(cursor)));
                            }
                        }
                    });
                    node.parentNode.replaceChild(fragment, node);
                } else if (node.nodeType === 1) {
                    Array.from(node.childNodes).forEach(walk);
                }
            }
            walk(tempDiv);
            return tempDiv.innerHTML;
        }

        // Run Logic
        ['case1', 'case2', 'case3', 'case4'].forEach(id => {
            const el = document.getElementById(id);
            el.innerHTML = highlightTerm(el.innerHTML);
        });
    </script>
</body>
</html>
