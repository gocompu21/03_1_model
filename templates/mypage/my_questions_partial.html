{% load bbs_extras %}

<!-- Scroll Data for Infinite Scroll -->
<div id="my-questions-scroll-data"
     data-page="{{ my_questions.number }}"
     data-has-next="{{ my_questions.has_next|yesno:'true,false' }}"
     data-next-page="{{ my_questions.next_page_number|default:'' }}"
     style="display: none;"></div>

<table class="history-table">
    <thead>
        <tr>
            <th style="padding-left:10px; text-align: left;">제목</th>
            <th style="width: 100px;">작성일시</th>
            <th style="width: 60px;">조회수</th>
        </tr>
    </thead>
    <tbody id="question-list-tbody">
        {% for post in my_questions %}
        <tr>
            <td style="text-align: left;">
                <a href="{% url 'mypage:detail_answer' post.pk %}" class="post-link"
                    style="text-decoration: none; color: #333; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px;">
                    {{ post.title|highlight_prefix }}
                </a>
            </td>

            <td style="text-align: center; color: #888; font-size: 0.9em;">
                {{ post.created_at|compact_date }}
            </td>
            <td>{{ post.hits }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" style="padding: 30px; color: #888;">작성한 질문 내역이 없습니다.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- Scroll Trigger for Infinite Scroll -->
{% if my_questions.has_next %}
<div id="my-questions-scroll-trigger" style="height: 1px;"></div>
{% endif %}

<!-- Loading Indicator -->
<div id="my-questions-loading" style="text-align: center; padding: 20px; display: none;">
    <i class="fas fa-spinner fa-spin" style="color: #2d6a4f;"></i> 불러오는 중...
</div>
