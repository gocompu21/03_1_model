<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ exam.title }} - 나무의사 합격반</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            background: #f4f7f5; color: #333; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 420px; width: 100%; padding: 38px 30px; text-align: center;
        }
        .icon {
            width: 66px; height: 66px; margin: 0 auto 18px; border-radius: 50%;
            background: #eef2ef; color: #7a8b80;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
        }
        h1 { font-size: 1.2rem; color: #1b4332; margin-bottom: 9px; }
        .lead { color: #666; font-size: 0.92rem; line-height: 1.65; margin-bottom: 22px; }
        .btn {
            display: inline-block; padding: 12px 24px; background: #2d6a4f; color: #fff;
            text-decoration: none; border-radius: 9px; font-weight: 600; font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-lock"></i></div>
        <h1>아직 볼 수 없습니다</h1>
        <p class="lead">
            시험을 제출한 뒤에 전체 현황과 정답을 확인할 수 있습니다.
        </p>
        <a href="{% url 'dvdexam:take' exam.id %}" class="btn">시험 보러 가기</a>
    </div>
</body>
</html>
