<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ exam.title }} - 나무의사 합격반</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            background: #f4f7f5; color: #333; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 420px; width: 100%; padding: 38px 30px; text-align: center;
        }
        .icon {
            width: 66px; height: 66px; margin: 0 auto 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
        }
        .icon.before { background: #d8f3dc; color: #2d6a4f; }
        .icon.closed { background: #eef2ef; color: #7a8b80; }
        h1 { font-size: 1.2rem; color: #1b4332; margin-bottom: 9px; }
        .lead { color: #666; font-size: 0.92rem; line-height: 1.65; }
        .when {
            background: #f7faf8; border: 1px solid #e6ece8; border-radius: 10px;
            padding: 14px; margin: 20px 0; font-size: 0.9rem; color: #40684f; font-weight: 600;
        }
        #countdown { color: #2d6a4f; font-variant-numeric: tabular-nums; }
        .btn {
            display: inline-block; padding: 12px 24px; background: #2d6a4f; color: #fff;
            text-decoration: none; border-radius: 9px; font-weight: 600; font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if state == 'before' %}
        <div class="icon before"><i class="fas fa-hourglass-start"></i></div>
        <h1>아직 시작 전입니다</h1>
        <p class="lead">시작 시각이 되면 응시할 수 있습니다.</p>
        <div class="when">
            {{ exam.start_at|date:"n월 j일(D) H:i" }} 시작<br>
            <span id="countdown"></span>
        </div>
        {% else %}
        <div class="icon closed"><i class="fas fa-flag-checkered"></i></div>
        <h1>종료된 시험입니다</h1>
        <p class="lead">응시 시간이 지나 더 이상 풀 수 없습니다.</p>
        <div class="when">{{ exam.end_at|date:"n월 j일(D) H:i" }} 종료</div>
        {% endif %}

        <a href="{% url 'dvdexam:index' %}" class="btn">시험 목록으로</a>
    </div>

{% if state == 'before' and exam.start_at %}
<script>
// 시작 시각이 되면 자동으로 응시 화면을 연다
const START = {{ exam.start_at|date:"U" }}000;
const el = document.getElementById('countdown');
setInterval(() => {
    const left = START - Date.now();
    if (left <= 0) { location.reload(); return; }
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    const s = Math.floor((left % 60000) / 1000);
    el.textContent = (h ? h + '시간 ' : '') + m + '분 ' + s + '초 남음';
}, 1000);
</script>
{% endif %}
</body>
</html>
