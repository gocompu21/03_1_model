<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}나무의사 기출문제 시스템{% endblock %}</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Hide any assistive/duplicate MathJax elements */
        mjx-assistive-mml {
            display: none !important;
        }
        
        /* Adjust global header links */
        header {
            background: #333;
            color: white;
            padding: 10px 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        main {
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* Unified Highlight Style for Terms */
        /* Targets spans with red color (common in explanations) */
        span[style*="color:red"],
        span[style*="color: red"],
        span[style*="color:#ff0000"],
        span[style*="color: #ff0000"],
        span[style*="rgb(255, 0, 0)"] {
            background-color: #fff9c4 !important; /* Light Yellow */
            color: #d32f2f !important; /* Deep Red */
            padding: 0;
            /* border-radius: 0; */
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
    </style>
    <!-- MathJax Configuration -->
    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: {'[+]': ['ams', 'mhchem', 'newcommand']},
                processEscapes: true
            },
            loader: {
                load: ['[tex]/ams', '[tex]/mhchem', '[tex]/newcommand']
            },
            chtml: {
                scale: 1,
                matchFontHeight: true
            },
            options: {
                enableAssistiveMml: false,
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'mjx-container']
            }
        };
    </script>
    <script id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    {% block header %}
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-weight: bold; font-size: 1.2em;">나무의사 기출문제 System</div>
            <nav>
                <a href="{% url 'exam:index' %}">시험보기</a>

                <a href="{% url 'exam:question_list' %}">문제관리</a>
                <a href="/admin/">관리자</a>
            </nav>
        </div>
    </header>
    {% endblock %}
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% if user.is_authenticated %}
    <script>
        // 모든 기기에서 세션 heartbeat 활성화 (체류시간 정확도 향상)
        (function() {
            setInterval(function() {
                fetch('{% url "accounts:session_heartbeat" %}', {
                    method: 'GET',
                    credentials: 'same-origin'
                }).catch(function() {});
            }, 60000);  // 1분마다
        })();

        // Unify Term Highlighting (Red text -> Yellow background)
        function applyHighlightToRedText() {
            const targets = document.querySelectorAll('.markdown-content, .card-text, .exp-text, .term-content');
            targets.forEach(container => {
                const elements = container.querySelectorAll('*');
                elements.forEach(el => {
                    // Skip if already highlighted by us
                    if (el.dataset.highlighted) return;

                    const computed = window.getComputedStyle(el);
                    const color = computed.color;
                    
                    // Parse RGB
                    const match = color.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
                    if (match) {
                        const r = parseInt(match[1]);
                        const g = parseInt(match[2]);
                        const b = parseInt(match[3]);
                        
                        // Check if Red is dominant (standard red is roughly 255,0,0 usually, or d32f2f which is 211,47,47)
                        // Heuristic: R > 150, R > G+50, R > B+50
                        if (r > 150 && r > g + 40 && r > b + 40) {
                            el.style.backgroundColor = '#fff9c4'; // Light Yellow
                            // el.style.padding = '0'; // User requested no side padding
                            // el.style.borderRadius = '0';
                            el.style.boxDecorationBreak = 'clone';
                            el.style.webkitBoxDecorationBreak = 'clone';
                            el.dataset.highlighted = 'true';
                        }
                    }
                });
            });
        }

        // Run periodically to catch dynamic content (MathJax updates, Tab switches)
        setInterval(applyHighlightToRedText, 1000);
    </script>
    {% endif %}

</body>
</html>
