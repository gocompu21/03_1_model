<!DOCTYPE html>
<html>
<head>
    <script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
    };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
    <h1>MathJax Test 2</h1>
    
    <p>Case 5: Textcolor inside text</p>
    $$ \text{\textcolor{#d93025}{CEC}} $$

    <p>Case 6: Breakout Hack</p>
    <!-- \text{ } \color{#d93025}\text{CEC} \text{ } -->
    $$ \text{ } \color{#d93025}\text{CEC} \text{ } $$
    
    <p>Case 7: Textcolor macro check</p>
    $$ \textcolor{#d93025}{CEC} $$

     <p>Case 8: MathRM Check</p>
    $$ \mathrm{{\color{#d93025}CEC}} $$
</body>
</html>
