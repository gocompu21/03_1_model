<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root { --green:#2d6a4f; --green-l:#e8f3ee; --line:#d7e3dc; --text:#1f2a24; --muted:#5f6f66; --red:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f3f6f4; color:var(--text); font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; font-size:19px; line-height:1.6; word-break:keep-all; overflow-wrap:anywhere; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  .wrap.wide { max-width:1080px; }
  header.top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:8px 0 16px; flex-wrap:wrap; }
  header.top h1 { margin:0; color:var(--green); font-size:28px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 6px rgba(0,0,0,.04); }
  .card h2 { margin:0 0 12px; font-size:21px; color:var(--green); }
  .btn { display:inline-flex; align-items:center; gap:8px; border:2px solid var(--green); background:#fff; color:var(--green); border-radius:12px; padding:10px 16px; font-size:17px; font-weight:700; text-decoration:none; cursor:pointer; font-family:inherit; }
  .btn.primary { background:var(--green); color:#fff; }
  .btn.big { width:100%; justify-content:center; font-size:22px; padding:16px; }
  .btn.danger { border-color:var(--red); color:var(--red); padding:6px 10px; font-size:15px; }
  .muted { color:var(--muted); }
  .hint { color:var(--muted); font-size:16px; margin:-6px 0 10px; }
  input[type=text], input[type=number], textarea { width:100%; font-size:20px; padding:12px 14px; border:2px solid var(--line); border-radius:12px; font-family:inherit; }
  input[type=text]:focus, input[type=number]:focus, textarea:focus { outline:none; border-color:var(--green); }
  .opts { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; }
  .opt { position:relative; }
  .opt input { position:absolute; opacity:0; width:1px; height:1px; }
  .opt span { display:flex; align-items:center; justify-content:center; text-align:center; min-height:56px; padding:10px; border:2px solid var(--line); border-radius:12px; background:#fff; cursor:pointer; font-size:18px; }
  .opt input:checked + span { background:var(--green); border-color:var(--green); color:#fff; font-weight:700; }
  .opt input:focus-visible + span { outline:3px solid #95d5b2; }
  .row3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .row3 .opt span { min-height:52px; font-size:16px; padding:6px; }
  .term { margin-bottom:14px; }
  .term b { display:block; margin-bottom:6px; }
  .errors { background:#fdecea; border:2px solid var(--red); color:var(--red); border-radius:12px; padding:12px 16px; margin-bottom:16px; }
  .errors ul { margin:6px 0 0; padding-left:20px; }
  /* 통계 */
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .stat { background:var(--green-l); border-radius:12px; padding:12px; text-align:center; }
  .stat .v { font-size:26px; font-weight:800; color:var(--green); }
  .stat .k { font-size:15px; color:var(--muted); }
  .bar { display:grid; grid-template-columns:minmax(90px, 32%) 1fr auto; gap:10px; align-items:center; margin:6px 0; font-size:16px; }
  .bar .track { background:#edf2ef; border-radius:8px; height:22px; overflow:hidden; }
  .bar .fill { background:var(--green); height:100%; }
  .bar .n { white-space:nowrap; color:var(--muted); font-size:15px; }
  .tbl-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:16px; }
  th, td { border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; }
  th { background:var(--green-l); white-space:nowrap; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
  .grid2 > .card { margin-bottom:0; }
  @media (max-width:420px) { body { font-size:18px; } .card { padding:16px; } .opts { grid-template-columns:1fr 1fr; } header.top h1 { font-size:24px; } }
</style>
